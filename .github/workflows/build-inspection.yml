name: WolfTrap Stage 3 offline build inspection

on:
  push:
    branches:
      - feat/wolftrap-stage3-build-inspector-v0_3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Bounded self-scan and synthetic negative control
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: src
    steps:
      - name: Check out the exact candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Install the bounded YAML parser
        run: python -m pip install --no-cache-dir PyYAML==6.0.3

      - name: Run all unit tests with source identity
        run: python -m wolftrap.test_runner --output reports/unit-tests.json

      - name: Scan WolfTrap without executing its target
        shell: bash
        run: |
          set -euo pipefail
          python -m wolftrap scan-build \
            --root . \
            --output-dir "$RUNNER_TEMP/wolftrap-stage3-self"
          mkdir -p reports/stage3
          cp -R "$RUNNER_TEMP/wolftrap-stage3-self" reports/stage3/self

      - name: Check that a deliberately flawed fixture is detected
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python -m wolftrap scan-build \
            --root tests/fixtures/build_scan/adversarial \
            --output-dir "$RUNNER_TEMP/wolftrap-stage3-adversarial"
          result=$?
          set -e
          if [ "$result" -ne 1 ]; then
            echo "Expected REVIEW_REQUIRED (1), observed: $result" >&2
            exit 2
          fi
          mkdir -p reports/stage3
          cp -R "$RUNNER_TEMP/wolftrap-stage3-adversarial" reports/stage3/adversarial

      - name: Independently validate evidence manifests and expected rules
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected = {
              "self": ("NO_PATTERN_MATCH", 2, set()),
              "adversarial": (
                  "REVIEW_REQUIRED",
                  3,
                  {
                      "WT-GHA-001", "WT-GHA-002", "WT-GHA-003",
                      "WT-GHA-005", "WT-DOCKER-001", "WT-DOCKER-002",
                  },
              ),
          }
          for name, (status, count, rules) in expected.items():
              root = Path("reports/stage3") / name
              manifest = json.loads((root / "build-scan.manifest.json").read_text())
              assert manifest["state"] == "COMPLETE"
              assert manifest["qualification_status"] == status
              assert set(manifest["files"]) == {
                  "build-scan.json", "build-scan.md", "build-scan.sarif"
              }
              for path, metadata in manifest["files"].items():
                  contents = (root / path).read_bytes()
                  assert metadata["bytes"] == len(contents)
                  assert metadata["sha256"] == hashlib.sha256(contents).hexdigest()
              report = json.loads((root / "build-scan.json").read_text())
              sarif = json.loads((root / "build-scan.sarif").read_text())
              assert report["qualification"]["status"] == status
              assert report["summary"]["files_inspected"] == count
              assert report["summary"]["errors"] == 0
              assert {f["rule_id"] for f in report["findings"]} == rules
              assert len(report["findings"]) == len(rules)
              assert len(sarif["runs"][0]["results"]) == len(rules)
              assert report["target_code_executed"] is False
              assert report["external_systems_contacted"] is False
              assert report["model_used"] is False
              assert manifest["input_digest"] == report["coverage"]["input_digest"]
          PY

      - name: Upload qualification evidence even if checks fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wolftrap-stage3-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
