name: WolfTrap Stage 5 offline evasion challenge

on:
  push:
    branches:
      - feat/wolftrap-stage5-evasion-challenge-v0_5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Deterministic detector tournament and evidence integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: src
    steps:
      - name: Check out exact revision with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Install bounded parser
        run: python -m pip install --no-cache-dir PyYAML==6.0.3

      - name: Run all regression tests
        run: python -m wolftrap.test_runner --output reports/stage5/unit-tests.json

      - name: Run full seeded 128-case offline tournament
        run: python -m wolftrap challenge-build --seed 20261115 --cases 128 --output-dir reports/stage5/challenge

      - name: Independently verify report hashes and labels
        shell: bash
        run: |
          set -euo pipefail
          python -m wolftrap verify-challenge --evidence-dir reports/stage5/challenge
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path('reports/stage5/challenge/challenge-report.json').read_text())
          assert report['qualification']['status'] == 'PASSED_BOUNDED'
          assert report['summary']['cases'] == 128
          assert report['summary']['mismatches'] == 0
          assert report['summary']['by_expected'] == {
              group: {'total': 32, 'matched': 32}
              for group in ('HIGH', 'MEDIUM', 'NONE', 'INCONCLUSIVE')
          }
          source = {
              'commit_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'cases': 128,
              'gaps': 0,
          }
          Path('reports/stage5/source-identity.json').write_text(
              json.dumps(source, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Retain evidence even if a gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wolftrap-stage5-${{ github.run_id }}
          path: reports/stage5/
          if-no-files-found: warn
          retention-days: 14
