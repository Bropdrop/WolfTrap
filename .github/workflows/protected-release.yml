name: Protected release gates

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Independently approved immutable main commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    steps:
      - name: Require explicit protected main dispatch at the reviewed commit
        env:
          APPROVED: ${{ inputs.reviewed_sha }}
          EXACT: ${{ github.sha }}
          REF: ${{ github.ref }}
          PROTECTED: ${{ github.ref_protected }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          test "$EVENT" = workflow_dispatch
          test "$REF" = refs/heads/main
          test "$PROTECTED" = true
          [[ "$APPROVED" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVED" = "$EXACT"
  build:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      wheel: ${{ steps.build.outputs.wheel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: ''
      - run: >-
          python -I -m pip --isolated download --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r .github/product-builder.lock --dest "$RUNNER_TEMP/tools"
      - id: build
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --no-new-privs --bounding-set=-all -- \
            env -i PATH="$PATH" python -I scripts/build-product.py --expected-head "$GITHUB_SHA" --wheelhouse "$RUNNER_TEMP/tools" --output-dir "$RUNNER_TEMP/kit"
          cut -d ' ' -f 1 "$RUNNER_TEMP/kit/SHA256SUMS" | head -1 | sed 's/^/wheel=/' >> "$GITHUB_OUTPUT"
  qualify:
    needs: build
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: ''
      - run: >-
          python -I -m pip --isolated download --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r .github/product-builder.lock --dest "$RUNNER_TEMP/tools"
      - name: Compare independent rebuild to the selected artifact
        env:
          BUILT_WHEEL: ${{ needs.build.outputs.wheel }}
        run: |
          set -euo pipefail
          ns=$(readlink /proc/self/ns/net)
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --no-new-privs --bounding-set=-all -- \
            env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 python -I release/qualification --expected-head "$GITHUB_SHA" \
            --parent-netns "$ns" --wheelhouse "$RUNNER_TEMP/tools" --output-dir "$RUNNER_TEMP/evaluation" --expected-wheel-sha256 "$BUILT_WHEEL" --require-install
  approval:
    needs: qualify
    runs-on: ubuntu-24.04
    permissions: {}
    environment: awooo-release-review
    steps:
      - run: echo 'A protected environment and independent reviewers must be configured by the maintainers.'
  sign:
    needs: approval
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Production trust gate
        run: |
          echo 'BLOCKED. Production signer, authenticated review witness and trust root are unqualified.'
          exit 1
  publish:
    needs: sign
    runs-on: ubuntu-24.04
    permissions: {}
    environment: awooo-publication-review
    steps:
      - name: Production custody gate
        run: |
          echo 'BLOCKED. Immutable public custody and release authorization are unqualified.'
          exit 1
