name: WolfTrap WolfPrint identity qualification

on:
  pull_request:
    branches: [main, feat/wolftrap-integrated-v1, feat/wolfprint-agent-identity-v1]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Verify fictional identities and scoped policy evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WOLFTRAP_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.WOLFTRAP_HEAD }}
          persist-credentials: false

      - name: Qualify and screen in a loopback-only namespace
        shell: bash
        run: |
          set -euo pipefail
          parent_namespace=$(readlink /proc/self/ns/net)
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" \
            --clear-groups --no-new-privs --bounding-set=-all -- env -i \
            PATH=/usr/bin:/bin PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            python3 scripts/qualify-wolfprint.py --expected-head "$WOLFTRAP_HEAD" \
            --parent-netns "$parent_namespace" --output-dir "$RUNNER_TEMP/wolftrap-wolfprint"

      - name: Retain the screened fictional evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wolftrap-wolfprint-v1
          path: |
            ${{ runner.temp }}/wolftrap-wolfprint/qualification.json
            ${{ runner.temp }}/wolftrap-wolfprint/unit-tests.json
            ${{ runner.temp }}/wolftrap-wolfprint/challenge/wolfprint.json
            ${{ runner.temp }}/wolftrap-wolfprint/challenge/wolfprint.md
            ${{ runner.temp }}/wolftrap-wolfprint/challenge/wolfprint.sarif
            ${{ runner.temp }}/wolftrap-wolfprint/challenge/wolfprint.manifest.json
            ${{ runner.temp }}/wolftrap-wolfprint/selected/wolfprint.json
            ${{ runner.temp }}/wolftrap-wolfprint/selected/wolfprint.md
            ${{ runner.temp }}/wolftrap-wolfprint/selected/wolfprint.sarif
            ${{ runner.temp }}/wolftrap-wolfprint/selected/wolfprint.manifest.json
            ${{ runner.temp }}/wolftrap-wolfprint/cursorial/cursorial.json
            ${{ runner.temp }}/wolftrap-wolfprint/cursorial/cursorial-chains.json
            ${{ runner.temp }}/wolftrap-wolfprint/cursorial/cursorial.md
            ${{ runner.temp }}/wolftrap-wolfprint/cursorial/cursorial.sarif
            ${{ runner.temp }}/wolftrap-wolfprint/cursorial/cursorial.manifest.json
          if-no-files-found: error
          retention-days: 14
