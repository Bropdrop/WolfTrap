name: WolfTrap bounded research

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Deterministic non-negative seed (maximum 9223372036854775807)"
        required: true
        default: "20261113"
        type: string
      mutation_budget:
        description: "Maximum generated mutation cases"
        required: true
        default: "32"
        type: choice
        options:
          - "32"
          - "64"

permissions:
  contents: read

jobs:
  qualify:
    name: Synthetic qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: src
      WOLFTRAP_SEED: ${{ inputs.seed }}
      WOLFTRAP_MUTATION_BUDGET: ${{ inputs.mutation_budget }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Validate bounded inputs
        shell: bash
        run: |
          if [[ ! "$WOLFTRAP_SEED" =~ ^[0-9]+$ ]]; then
            echo "seed must be a non-negative decimal integer" >&2
            exit 2
          fi
          python -c 'import os; value = int(os.environ["WOLFTRAP_SEED"]); assert value <= 9223372036854775807, "seed exceeds the supported bound"'
          case "$WOLFTRAP_MUTATION_BUDGET" in
            32|64) ;;
            *) echo "mutation budget is outside the fixed choices" >&2; exit 2 ;;
          esac

      - name: Run standard-library tests
        run: python -m wolftrap.test_runner --output reports/unit-tests.json

      - name: Run bounded synthetic qualification
        run: >-
          python -m wolftrap run
          --seed "$WOLFTRAP_SEED"
          --max-mutations "$WOLFTRAP_MUTATION_BUDGET"
          --output-dir reports
          --unit-test-summary reports/unit-tests.json
          --sut correct-v1

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wolftrap-research-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
