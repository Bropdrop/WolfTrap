name: Public guard integrity
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/wolftrap/public_guard.py'
      - 'tests/test_guard_integrity.py'
      - 'scripts/*guard-integrity.py'
      - 'docs/guard-integrity/**'
      - '.github/workflows/guard-integrity.yml'
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WOLFTRAP_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the exact public candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.WOLFTRAP_EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Verify the approved dependency lock bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check --status <<'CHECKSUM'
          e570ebf0b5cb62dd21b578373a7eff72a908242f6a7fb5ae488f8bb07934c711  .github/qualification-requirements.txt
          CHECKSUM
      - name: Install the reviewed wheel without importing candidate modules
        run: >-
          python -I -m pip --isolated install --no-cache-dir --no-deps
          --only-binary=:all: --require-hashes --index-url https://pypi.org/simple
          -r .github/qualification-requirements.txt

      - name: Replay the original and corrected scanners and detect weakened guards offline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WOLFTRAP_EXPECTED_HEAD"
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" \
            --clear-groups --no-new-privs -- env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 \
            bash -euc '
              python -B scripts/qualify-guard-integrity.py > "$1/mutations.json"
              cmp "$1/mutations.json" docs/guard-integrity/evidence/mutations.json
              python -B scripts/replay-guard-integrity.py . > "$1/replay.json"
              for input in "$1/replay.json" docs/guard-integrity/evidence/replay.json; do
                jq -S "walk(if type == \"object\" then del(.environment) else . end)" "$input" > "$1/$(basename "$(dirname "$input")").normalized"
              done
              cmp "$1/$(basename "$1").normalized" "$1/evidence.normalized"
            ' qualification "$RUNNER_TEMP"
