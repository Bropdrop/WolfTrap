name: WolfTrap independent public qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Replay the exact public source offline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      WOLFTRAP_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact public candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.WOLFTRAP_EXPECTED_HEAD }}
          persist-credentials: false

      - name: Select Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Verify the approved dependency lock bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check --status <<'CHECKSUM'
          e570ebf0b5cb62dd21b578373a7eff72a908242f6a7fb5ae488f8bb07934c711  .github/qualification-requirements.txt
          CHECKSUM
      - name: Install the reviewed wheel without importing candidate modules
        run: >-
          python -I -m pip --isolated install --no-cache-dir --no-deps
          --only-binary=:all: --require-hashes --index-url https://pypi.org/simple
          -r .github/qualification-requirements.txt

      - name: Screen source, replay and screen the declared evidence with networking isolated
        shell: bash
        run: |
          set -euo pipefail
          parent_namespace=$(readlink /proc/self/ns/net)
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" \
            --clear-groups --no-new-privs -- env -i \
            PATH="$PATH" PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            bash -euc '
              python -m wolftrap.public_guard "$1" --workflow-dependencies
              python scripts/qualify-research.py --expected-head "$1" --parent-netns "$2" --output-dir "$3"
              python -m wolftrap.public_guard "$1" --report-root "$3" \
                --report qualification.json --report unit-tests.json \
                --report gt-vsa/gt-vsa.json --report gt-vsa/gt-vsa.md --report gt-vsa/gt-vsa.manifest.json
            ' qualification "$WOLFTRAP_EXPECTED_HEAD" "$parent_namespace" "$RUNNER_TEMP/wolftrap-independent-qualification"

      - name: Retain the screened qualification index and vehicle evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wolftrap-independent-qualification
          path: |
            ${{ runner.temp }}/wolftrap-independent-qualification/qualification.json
            ${{ runner.temp }}/wolftrap-independent-qualification/unit-tests.json
            ${{ runner.temp }}/wolftrap-independent-qualification/gt-vsa/gt-vsa.json
            ${{ runner.temp }}/wolftrap-independent-qualification/gt-vsa/gt-vsa.md
            ${{ runner.temp }}/wolftrap-independent-qualification/gt-vsa/gt-vsa.manifest.json
          if-no-files-found: error
          retention-days: 14
