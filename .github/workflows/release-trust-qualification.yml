name: Release trust qualification

on:
  pull_request:
    branches: [feat/offline-product-foundation-v1]

permissions:
  contents: read

jobs:
  subscriber:
    name: Pre-install verification (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      SOURCE: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: ''
      - name: Acquire locked build-only wheel
        run: >-
          python -I -m pip --isolated download --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r .github/product-builder.lock --dest "$RUNNER_TEMP/release-tools"
      - name: Qualify the foundation and subscriber in a fresh network namespace
        shell: bash
        run: |
          set -euo pipefail
          ns=$(readlink /proc/self/ns/net)
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --no-new-privs --bounding-set=-all -- \
            env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 bash -euc '
              python -I scripts/qualify-product.py --expected-head "$1" --parent-netns "$2" --wheelhouse "$3/release-tools" --output-dir "$3/foundation"
              python -I release/qualification --expected-head "$1" --parent-netns "$2" --wheelhouse "$3/release-tools" --output-dir "$3/release-evidence" --require-install
            ' qualification "$SOURCE" "$ns" "$RUNNER_TEMP"
      - name: Retain verified evaluation capsule and public evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evaluation-release-${{ matrix.runner }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/release-evidence/capsule/awooo-evaluation-00000001.zip
            ${{ runner.temp }}/release-evidence/trust/policy.json
            ${{ runner.temp }}/release-evidence/trust/root.pem
            ${{ runner.temp }}/release-evidence/trust/signer.pem
            ${{ runner.temp }}/release-evidence/qualification.json
            ${{ runner.temp }}/release-evidence/controls.json
            ${{ runner.temp }}/release-evidence/measurement.json
            ${{ runner.temp }}/release-evidence/receipt.json
            ${{ runner.temp }}/foundation/qualification.json

  regression:
    name: Exact source screening and independent research replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: ''
      - name: Install reviewed research dependency
        run: >-
          python -I -m pip --isolated install --no-cache-dir --no-deps
          --only-binary=:all: --require-hashes --index-url https://pypi.org/simple
          -r .github/qualification-requirements.txt
      - name: Run full offline regressions and screen public source and index
        shell: bash
        run: |
          set -euo pipefail
          ns=$(readlink /proc/self/ns/net)
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --no-new-privs --bounding-set=-all -- \
            env -i PATH="$PATH" PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 bash -euc '
              python -m wolftrap.public_guard "$1" --workflow-dependencies
              python scripts/qualify-research.py --expected-head "$1" --parent-netns "$2" --output-dir "$3"
              python -m wolftrap.public_guard "$1" --report-root "$3" --report qualification.json --report unit-tests.json
            ' research "$SOURCE" "$ns" "$RUNNER_TEMP/research"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-research-index
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/research/qualification.json
            ${{ runner.temp }}/research/unit-tests.json
