name: WolfTrap Stage 5.3 offline prompt qualification

on:
  pull_request:
    branches: [main, feat/wolftrap-integrated-v1, feat/wolfprint-agent-identity-v1]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify all stages and Stage 5.3 evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Install exact optional YAML parser for preceding stages
        run: python -m pip install --no-cache-dir PyYAML==6.0.3

      - name: Run full WolfTrap regression suite
        run: python -m wolftrap.test_runner --output "$RUNNER_TEMP/wolftrap-stage53-unit.json"

      - name: Assert conditional prompt fixture and verify saved evidence
        shell: bash
        run: |
          set -euo pipefail
          code=0
          python -m wolftrap scan-prompts --root tests/fixtures/prompt_docs --output-dir "$RUNNER_TEMP/wolftrap-stage53-prompt" || code=$?
          test "$code" -eq 1
          python -m wolftrap verify-prompts --evidence-dir "$RUNNER_TEMP/wolftrap-stage53-prompt"

      - name: Preserve Stage 5.1 challenge and 128-case Stage 5 detection
        shell: bash
        run: |
          set -euo pipefail
          python -m wolftrap challenge-agent --seed 20261115 --output-dir "$RUNNER_TEMP/wolftrap-stage53-agent"
          python -m wolftrap verify-agent-challenge --evidence-dir "$RUNNER_TEMP/wolftrap-stage53-agent"
          python -m wolftrap replay-agent-challenge --evidence-dir "$RUNNER_TEMP/wolftrap-stage53-agent" --output-dir "$RUNNER_TEMP/wolftrap-stage53-replay"
          python -m wolftrap verify-agent-challenge --evidence-dir "$RUNNER_TEMP/wolftrap-stage53-replay"
          python -m wolftrap challenge-build --seed 20261115 --cases 128 --output-dir "$RUNNER_TEMP/wolftrap-stage53-stage5"
          python -m wolftrap verify-challenge --evidence-dir "$RUNNER_TEMP/wolftrap-stage53-stage5"

      - name: Screen the declared Stage 5.3 evidence files
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          files=(wolftrap-stage53-unit.json)
          for name in prompt-scan.json prompt-scan.md prompt-scan.sarif prompt-scan.manifest.json; do
            files+=("wolftrap-stage53-prompt/$name")
          done
          for suite in agent replay; do
            for name in agent-challenge-report.json agent-challenge-report.md agent-challenge-cases.json agent-challenge.manifest.json; do
              files+=("wolftrap-stage53-$suite/$name")
            done
          done
          for name in challenge-report.json challenge-report.md challenge-cases.json challenge.manifest.json; do
            files+=("wolftrap-stage53-stage5/$name")
          done
          args=()
          for file in "${files[@]}"; do args+=(--report "$file"); done
          python -m wolftrap.public_guard HEAD --report-root "$RUNNER_TEMP" "${args[@]}"
          publication=$(mktemp --directory "$RUNNER_TEMP/wolftrap-stage53-publication.XXXXXXXX")
          (
            cd "$RUNNER_TEMP"
            cp --parents -- "${files[@]}" "$publication"
          )
          echo "path=$publication" >> "$GITHUB_OUTPUT"

      - name: Retain only the screened offline evidence files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wolftrap-stage53-offline-evidence
          path: ${{ steps.publication.outputs.path }}
          if-no-files-found: error
          retention-days: 14
