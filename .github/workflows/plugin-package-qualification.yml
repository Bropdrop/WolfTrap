name: WolfTrap plugin package qualification

on:
  pull_request:
    paths:
      - 'plugins/wolftrap-security/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/plugin-package-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate portable manifest and local marketplace (no network tools)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate package with standard library only
        run: python3 -m unittest discover -s plugins/wolftrap-security/tests -p 'test_*.py' -v
