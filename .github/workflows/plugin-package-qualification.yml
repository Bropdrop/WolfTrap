name: WolfTrap plugin package qualification

on:
  pull_request:
    paths:
      - 'plugins/wolftrap-security/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/plugin-package-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate package and offline scanner fixture contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use pinned Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Validate portable package and marketplace
        run: python -m unittest discover -s plugins/wolftrap-security/tests -p 'test_package.py' -v

      - name: Verify approved parser lock bytes
        run: >-
          echo 'e570ebf0b5cb62dd21b578373a7eff72a908242f6a7fb5ae488f8bb07934c711  .github/qualification-requirements.txt'
          | sha256sum --check --status

      - name: Install hash-pinned build scanner parser
        run: >-
          python -I -m pip --isolated install --no-cache-dir --no-deps
          --only-binary=:all: --require-hashes --index-url https://pypi.org/simple
          -r .github/qualification-requirements.txt

      - name: Run read-only end-to-end fixture tests with network isolated
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)"             --clear-groups --no-new-privs -- env -i             PATH="$PATH" PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0             python -m unittest discover -s plugins/wolftrap-security/tests               -p 'test_integration.py' -v
