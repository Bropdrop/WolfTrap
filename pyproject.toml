[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wolftrap"
version = "0.1.0"
description = "A bounded synthetic authorization adversarial research harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
build-scan = ["PyYAML>=6.0.1,<7"]

[project.scripts]
wolftrap = "wolftrap.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wolftrap = ["scenarios/v1/*.json", "schemas/*.json", "data/*.json"]
